[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cortensor-sentinel"
version = "0.1.0"
description = "On-Chain & DeFi Smart-Contract Risk & Cortensor RPC/Router Health Verifier Agent built on OpenMinion 0.1 SDK"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Cortensor Hackathon #5 Builder" }]
dependencies = [
  "openminion>=0.1.18",
  "pydantic>=2.0",
  "httpx>=0.27",
  "rich>=13.0",
]

[project.scripts]
cortensor-sentinel = "cortensor_sentinel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
